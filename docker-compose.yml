services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      # Привязка ТОЛЬКО к localhost: Qdrant поднимается без пароля, наружу его публиковать
      # нельзя. Для доступа снаружи задайте ключ доступа через окружение
      # QDRANT__SERVICE__API_KEY (и тогда меняйте bind на 0.0.0.0 осознанно + TLS/прокси).
      - "127.0.0.1:6333:6333"   # REST/gRPC HTTP API
      - "127.0.0.1:6334:6334"   # gRPC (нужен qdrant-client при prefer_grpc=True; иначе можно убрать)
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # FIXME(review): образ qdrant может не содержать curl/bash (distroless/slim). Проверьте
      # для тега v1.12.4; если проба не работает — используйте внешний мониторинг или уберите блок.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

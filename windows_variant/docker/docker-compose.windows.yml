# Запуск RAG в Docker Desktop на Windows.
#  - qdrant : векторная БД (контейнер)
#  - app    : RAG-приложение (контейнер, CPU)
# Генерация (LLM) — через Ollama, установленный на самом Windows-хосте,
# контейнер обращается к нему по адресу host.docker.internal:11434.
#
# Перед запуском:
#   1) скопируйте .env.docker.example -> .env.docker и при необходимости поправьте;
#   2) создайте файл .env (рядом с этим compose) со строкой:
#         DOCS_DIR_HOST=C:\путь\к\папке\с\документами
#   3) docker compose -f docker-compose.windows.yml up -d --build
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"   # доступ к БД с хоста (необязательно, для диагностики)

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    # чистый кэш без персистентности + лимит памяти и LRU-вытеснение (не даёт разрастись)
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Milvus Standalone (опционально) --------------------------------------
  # Полноценная векторная СУБД как альтернатива Qdrant. Стартует ТОЛЬКО с профилем
  # milvus, чтобы обычная установка оставалась лёгкой:
  #     docker compose -f docker-compose.windows.yml --profile milvus up -d
  # Затем в панели «Векторная база (Milvus)» задайте MILVUS_MODE=standalone и
  # MILVUS_URI=http://milvus:19530, перенесите данные и переключите бэкенд в блоке
  # «Векторная база: Qdrant ⇄ Milvus». Для встроенного Milvus Lite эти сервисы НЕ нужны.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: rag_milvus_etcd
    profiles: ["milvus"]
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd:/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag_milvus_minio
    profiles: ["milvus"]
    restart: unless-stopped
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: minio server /minio_data
    volumes:
      - milvus_minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15               # GPU-индексы: milvusdb/milvus:v2.4.15-gpu (+ deploy.resources GPU)
    container_name: rag_milvus
    profiles: ["milvus"]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
    depends_on:
      - milvus-etcd
      - milvus-minio
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC (клиент pymilvus)
      - "9091:9091"     # метрики/health

  app:
    build:
      context: ../..                              # корень репозитория
      dockerfile: windows_variant/docker/Dockerfile
    container_name: rag_app
    restart: unless-stopped
    depends_on:
      - qdrant
      - redis
    env_file:
      - .env.docker
    environment:
      - HF_HOME=/root/.cache/huggingface          # кеш моделей эмбеддингов/реранка
      - RAG_DOCKER=1                               # признак контейнера (обновление — на хосте через update.cmd)
      # адрес Qdrant в сети compose — фиксируем здесь (имеет приоритет над .env.docker),
      # чтобы приложение всегда обращалось к сервису qdrant, а не к localhost
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=company_kb
      # Redis-кэш в сети compose. Действует для НОВЫХ установок; если Redis уже
      # включали в панели, хост мог сохраниться в runtime_config.json (127.0.0.1) и
      # перекрыть эти значения — тогда задайте REDIS_HOST=redis в панели или командой
      # settings.update (см. подсказку в README / ответе).
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Milvus: адрес сервиса standalone в сети compose (действует при MILVUS_MODE=standalone).
      # Для встроенного Milvus Lite задаётся путь к файлу на смонтированном томе (см. volume ниже).
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_LITE_PATH=/app/state/milvus_lite.db
    extra_hosts:
      - "host.docker.internal:host-gateway"       # доступ к Ollama на хосте
    ports:
      - "8000:8000"                               # веб-интерфейс: http://localhost:8000
    volumes:
      # папка с документами — на запись: сюда пишутся загрузки файлов/папок,
      # спарсенные сайты и восстановление документов из резервной копии
      - "${DOCS_DIR_HOST:-./docs}:/data/docs"
      - hf_cache:/root/.cache/huggingface         # чтобы не качать модели заново
      - ./state/runtime_config.json:/app/runtime_config.json  # настройки админки
      - ./state/rag_logs.db:/app/rag_logs.db                   # логи/оценки
      - ./state/ingest_stats.json:/app/ingest_stats.json       # время обработки файлов
      - ./state:/app/state                        # хранилище Milvus Lite (milvus_lite.db) и пр.
      - ./backups:/app/backups                    # резервные копии (доступны на хосте)
      - previews_cache:/app/previews              # кеш превью (миниатюры/кадры)

volumes:
  qdrant_storage:
  hf_cache:
  previews_cache:
  milvus_etcd:
  milvus_minio:
  milvus_data:

# Override для работы приложения на GPU NVIDIA в Docker на Windows
# (эмбеддинги / реранк / Whisper внутри контейнера).
#
# Использование (вместе с основным compose):
#   docker compose -f docker-compose.windows.yml -f docker-compose.gpu.yml up -d --build
# Либо через лаунчер:  start.cmd / update.cmd   (GPU включён ПО УМОЛЧАНИЮ).
#   Для CPU-режима добавьте ключ  -Cpu  (напр.  update.cmd -Cpu).  Отдельного ключа
#   «-Cuda» нет — GPU и так по умолчанию.
#
# Что делает:
#   - собирает образ с CUDA-сборкой PyTorch (build-arg TORCH_INDEX_URL=cu124);
#   - выставляет DEVICE=cuda (перекрывает DEVICE=cpu основного compose);
#   - пробрасывает все GPU NVIDIA в контейнер app.
#
# Требования на ХОСТЕ (Windows):
#   - актуальный драйвер NVIDIA;
#   - Docker Desktop с бэкендом WSL2 и включённой поддержкой GPU;
#   - проверка проброса:
#       docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
# Генерация (LLM) по-прежнему идёт через Ollama на хосте (Ollama сама использует GPU
# хоста); здесь GPU ускоряет именно индексацию/поиск (bge-m3 + реранкер + Whisper).

services:
  app:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    environment:
      - DEVICE=cuda
      # utility — чтобы в контейнер попали nvidia-smi/NVML (полная телеметрия GPU
      # в разделе «Загрузка сервера»); compute — собственно CUDA-вычисления.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Отменять устаревшие прогоны на том же ref (экономия раннеров).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install "ruff==0.15.11"
      - name: Lint (repo-wide, real-bug gate from pyproject)
        run: ruff check .
      - name: Lint (strict — tests only)
        run: ruff check tests/ --select E,F,I,B,C4,UP

  # ------------------------------------------------------------------ tests
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Тяжёлые зависимости (torch, sentence-transformers, qdrant, ...) НЕ ставим:
      # чистые тесты работают на заглушках из tests/conftest.py.
      - name: Install minimal test deps
        run: python -m pip install "pytest>=8,<9" "PyYAML>=6"
      - name: Run unit tests
        run: python -m pytest -q

  # ------------------------------------------------------------------ shell
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # severity=error: гейтим на реальных ошибках, не на стилистических замечаниях легаси-скриптов.
      - name: Run shellcheck
        run: |
          set -e
          shopt -s nullglob
          files=( *.sh scripts/*.sh )
          if [ ${#files[@]} -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          echo "checking: ${files[*]}"
          shellcheck --severity=error "${files[@]}"

  # ------------------------------------------------------------ repo checks
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install YAML lib
        run: python -m pip install "PyYAML>=6"
      - name: Validate compose YAML
        run: |
          if [ -f windows_variant/docker/docker-compose.windows.yml ] \
             && [ -f docker_variant/docker-compose.yml ]; then
            python scripts/ci_check_yaml.py
          else
            echo "compose-варианты отсутствуют в этом checkout — проверяем docker-compose.yml"
            python -c "import yaml; yaml.safe_load(open('docker-compose.yml', encoding='utf-8')); print('OK docker-compose.yml')"
          fi
      - name: Check inline JS in static/index.html
        run: |
          if [ -f static/index.html ]; then
            JS=$(python scripts/ci_check_inline_js.py)
            node --check "$JS"
          else
            echo "static/index.html отсутствует — пропускаем проверку инлайн-JS"
          fi

name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all root Python modules (syntax check)
        shell: bash
        run: python -m py_compile *.py

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Run unit tests
        run: pytest -q

      - name: Validate compose YAML
        run: python scripts/ci_check_yaml.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check inline JS in static/index.html
        run: node --check "$(python scripts/ci_check_inline_js.py)"
